name: Validate standalone app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate lab maintenance and timeline logic
        run: node scripts/validate-lab-timeline.cjs
      - name: Validate maintenance calendar intervals
        run: node scripts/validate-maintenance-calendar.cjs
      - name: Validate spare stock movements
        run: node scripts/validate-spare-stock.cjs
      - name: Validate imported-data HTML escaping
        run: node scripts/validate-html-escaping.cjs
      - name: Validate cache recovery write protection
        run: node scripts/validate-storage-recovery.cjs
      - name: Validate equipment calibration workflow and backups
        run: node scripts/validate-calibration.cjs
      - name: Validate experiment lifecycle and audit integration
        run: node scripts/validate-experiment-lifecycle.cjs
      - name: Validate readable typography and focus states
        run: node scripts/validate-readability.cjs
      - name: Parse embedded JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8') + '<script>' + fs.readFileSync('assets/js/legacy-app.js', 'utf8') + String.fromCharCode(60,47,115,99,114,105,112,116,62);
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)];
          const executable = scripts.filter(([, attrs]) => {
            const type = (attrs.match(/\btype=["']([^"']+)["']/i) || [])[1] || '';
            return !type || /^(module|text\/javascript|application\/javascript)$/i.test(type);
          });
          if (!executable.length) throw new Error('No inline executable JavaScript found');
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'inline-js-'));
          executable.forEach(([, , source], index) => {
            const file = path.join(dir, `script-${index + 1}.js`);
            fs.writeFileSync(file, source);
            execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          });
          console.log(`Syntax OK: ${executable.length} inline script(s)`);
          NODE

  browser-ekpo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Serve the standalone lab operations workspace
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ekpo-http.log 2>&1 &
          echo $! > /tmp/ekpo-http.pid
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ekpo-http.log
          exit 1
      - name: Verify operations modules and mobile navigation
        run: node scripts/browser-ekpo-smoke.cjs
